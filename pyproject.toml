[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# NOTE: the project name is intentionally referenced in one place per file.
# To rename the project run:  python scripts/rename.py <newname>
name = "aiproof"
version = "0.1.0"
description = "LLM audit log, prompt injection detection, PII redaction (ИНН, СНИЛС) and compliance evidence (FSTEC 117, OWASP LLM, ISO 42001, EU AI Act) for AI apps and agents. Two lines to integrate."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "BUSL-1.1" }
authors = [{ name = "Arseniy Scheltsin", email = "scheltsin@gmail.com" }]
keywords = ["llm", "ai-security", "llm-security", "audit-log", "compliance", "fstec", "fstek-117", "152-fz", "pii-redaction", "prompt-injection", "ai-governance", "ai-bom", "cyclonedx", "owasp-llm", "iso-42001", "eu-ai-act", "nist-ai-rmf", "gigachat", "yandexgpt", "openai", "anthropic", "tamper-evident", "evidence"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.optional-dependencies]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.20"]
langchain = ["langchain-core>=0.1"]
dev = ["pytest>=7", "build", "ruff"]

[project.scripts]
aiproof = "aiproof.cli:main"

[project.urls]
Homepage = "https://github.com/aiproof/aiproof"
License = "https://github.com/aiproof/aiproof/blob/main/COMMERCIAL.md"
Spec = "https://github.com/aiproof/aiproof/tree/main/docs/spec"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aiproof = ["controls/*.json", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py39"
