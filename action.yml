name: "aiproof AI security check"
description: "AI security & compliance check for LLM apps (FSTEC 117, OWASP LLM, ISO 42001, EU AI Act) | Проверка безопасности ИИ-приложений: ФСТЭК 117, 152-ФЗ, OWASP LLM"
author: "Arseniy Scheltsin"
branding:
  icon: "shield"
  color: "blue"
inputs:
  path:
    description: "Directory to scan"
    required: false
    default: "."
  controls:
    description: "Comma-separated control sets: ru-fstek-117, ru-152fz, owasp-llm-2025, eu-ai-act, iso-42001, nist-ai-rmf, or a path to your own JSON"
    required: false
    default: "ru-fstek-117"
  fail-on:
    description: "When to fail the job: fail (any FAIL control or high/critical finding), manual (also MANUAL controls), never"
    required: false
    default: "fail"
  version:
    description: "aiproof version to install (pip spec, e.g. aiproof==0.1.0; '.' installs the checked-out repository)"
    required: false
    default: "aiproof"
  report:
    description: "Path of the JSON report artifact"
    required: false
    default: "aiproof-report.json"
outputs:
  report:
    description: "Path to the JSON report"
    value: ${{ inputs.report }}
runs:
  using: "composite"
  steps:
    - shell: bash
      run: python3 -m pip install --quiet "${{ inputs.version }}"
    - shell: bash
      run: |
        aiproof check "${{ inputs.path }}" --controls "${{ inputs.controls }}" --fail-on "${{ inputs.fail-on }}" \
          --json "${{ inputs.report }}" --no-ledgers
    - uses: actions/upload-artifact@v5
      if: always()
      with:
        name: aiproof-report
        path: ${{ inputs.report }}
