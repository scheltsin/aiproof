name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: pytest -q
      - run: aiproof check . --fail-on never

  self-attest:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: aiproof attest . --no-ledgers --out evidence.zip && aiproof verify evidence.zip
      - uses: actions/upload-artifact@v5
        with:
          name: evidence
          path: evidence.zip

  action-smoke:
    # the composite action from this very repository, run against itself
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: ./
        with:
          fail-on: never
          version: "."
